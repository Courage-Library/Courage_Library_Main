<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Portal | Courage Library</title>
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease both; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    
    /* Live update indicator */
    .live-indicator {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: white;
      padding: 12px 20px;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #10b981;
      z-index: 1000;
      border: 2px solid #d1fae5;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Loading -->
  <div id="loadingState" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full spinner mx-auto mb-4"></div>
      <p class="text-gray-500 font-medium">Loading teacher portal...</p>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" class="hidden">
    
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <img src="/images/logo.png" alt="CL" class="w-10 h-10 rounded-xl">
            <div>
              <h1 class="text-lg font-bold text-blue-700">Courage Library</h1>
              <p class="text-xs text-gray-500">Teacher Portal</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
              <p id="teacherName" class="text-sm font-semibold text-gray-900">Teacher</p>
              <p class="text-xs text-gray-500">Instructor</p>
            </div>
            <button onclick="logout()" 
              class="px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 rounded-lg transition">
              <i class="fas fa-sign-out-alt mr-2"></i>Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

      <!-- Coaching Info Card - Mobile Responsive -->
      <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-blue-600 rounded-xl p-4 sm:p-6 fade-in">
        <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
          <div class="flex-1">
            <h2 id="coachingName" class="text-xl sm:text-2xl font-bold text-gray-900 mb-1">Loading...</h2>
            <p id="coachingCity" class="text-sm text-gray-600 mb-3"><i class="fas fa-map-marker-alt mr-2 text-blue-600"></i>City</p>
            <div class="flex flex-wrap items-center gap-2 sm:gap-4 text-sm">
              <span id="studentCount" class="bg-white px-3 py-1.5 rounded-lg font-semibold text-gray-700 text-xs sm:text-sm">
                <i class="fas fa-users text-blue-600 mr-1"></i>- Students
              </span>
              <span id="examCount" class="bg-white px-3 py-1.5 rounded-lg font-semibold text-gray-700 text-xs sm:text-sm">
                <i class="fas fa-clipboard-list text-green-600 mr-1"></i>- Exams
              </span>
            </div>
          </div>
          <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm w-full lg:w-auto">
            <p class="text-xs text-gray-500 mb-1">Join Link</p>
            <div class="flex items-center gap-2">
              <code id="joinLink" class="text-xs bg-gray-100 px-2 py-1 rounded font-mono break-all flex-1">Loading...</code>
              <button onclick="copyJoinLink()" class="text-blue-600 hover:text-blue-700 flex-shrink-0 p-2">
                <i class="fas fa-copy"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick Stats -->
      <div id="statsRow" class="grid grid-cols-1 sm:grid-cols-3 gap-4 fade-in">
        <!-- Will be populated by JS -->
      </div>

      <!-- Exams Section -->
      <div class="fade-in">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold text-gray-900">
            <i class="fas fa-clipboard-list text-blue-600 mr-2"></i>Scheduled Exams
          </h2>
        </div>
        <div id="examsGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- Will be populated by JS -->
        </div>
      </div>

    </main>

    <!-- Simple Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
          <!-- Brand -->
          <div class="flex items-center gap-2">
            <img src="/images/logo.png" alt="CL" class="w-7 h-7 rounded-lg">
            <span class="font-bold text-blue-700 text-sm">Courage Library</span>
          </div>
          
          <!-- Support -->
          <div class="flex flex-col sm:flex-row items-center gap-3 sm:gap-6 text-sm text-gray-600">
            <a href="mailto:support@couragelibrary.in" class="hover:text-blue-600 transition flex items-center gap-2">
              <i class="fas fa-envelope text-blue-600"></i>
              support@couragelibrary.in
            </a>
            <a href="tel:+918707884735" class="hover:text-blue-600 transition flex items-center gap-2">
              <i class="fas fa-phone text-blue-600"></i>
              +91 8707884735
            </a>
          </div>
        </div>
        
        <!-- Copyright -->
        <div class="text-center mt-4 pt-4 border-t border-gray-100 text-xs text-gray-500">
          &copy; 2026 Courage Library. All rights reserved.
        </div>
      </div>
    </footer>

  </div>

  <!-- Toast -->
  <div id="toast-container" style="position:fixed;top:20px;right:20px;z-index:10000;"></div>

  <!-- Live Update Indicator -->
  <div id="liveIndicator" class="live-indicator" style="display: none;">
    <span class="live-dot"></span>
    <span>Live Updates</span>
  </div>

  <script src="/js/teacherDashboard.js"></script>

</body>
</html>

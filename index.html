<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courage Library — Coming soon</title>
<meta name="description" content="Learn Smarter. Prepare Independently. Something new from Courage Library is coming soon.">
<meta name="theme-color" content="#07080C">
<meta property="og:title" content="Courage Library — Coming soon">
<meta property="og:description" content="Learn Smarter. Prepare Independently.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="images/logos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080C; --ink:#EDEEF2; --mute:#8D93A3; --line:rgba(255,255,255,.09);
    --accent:#6FE3F0; --pad:clamp(20px,4vw,56px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg)}
  body{
    color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  /* ---------- background layers ---------- */
  .nebula{position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:
      radial-gradient(38% 30% at 30% 32%, rgba(30,227,238,.10), transparent 70%),
      radial-gradient(34% 28% at 72% 64%, rgba(78,0,228,.16), transparent 70%),
      radial-gradient(60% 45% at 50% 112%, rgba(40,60,160,.12), transparent 70%);
    filter:blur(20px); animation:breathe 26s ease-in-out infinite alternate}
  @keyframes breathe{from{transform:scale(1) rotate(0deg)}to{transform:scale(1.08) rotate(4deg)}}
  .shoot{position:fixed; z-index:1; top:12%; left:-20%; width:180px; height:1px; pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(220,250,255,.9));
    opacity:0; transform:rotate(-18deg); animation:shoot 11s 3s ease-in infinite}
  .shoot.s2{top:30%; animation-duration:17s; animation-delay:9s}
  @keyframes shoot{
    0%{transform:translate(0,0) rotate(-18deg); opacity:0}
    2%{opacity:1}
    9%{transform:translate(140vw,-46vh) rotate(-18deg); opacity:0}
    100%{opacity:0}}
  #scene{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1}
  .vignette{position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 85% at 50% 42%, transparent 42%, rgba(0,0,0,.66) 100%)}
  .grain{position:fixed; inset:-50%; z-index:1; pointer-events:none; opacity:.07; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(6) infinite}
  @keyframes grain{
    0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}
    60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}

  /* ---------- layout: header / stage (3D logo) / headline / button ---------- */
  .frame{position:relative; z-index:2; height:100vh; height:100dvh;
    display:grid; grid-template-rows:auto minmax(150px,1fr) auto auto;
    row-gap:0;
    padding:max(24px,env(safe-area-inset-top)) var(--pad) max(24px,env(safe-area-inset-bottom))}

  .bar{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--mute)}
  .mark{display:flex; align-items:center; gap:10px; color:var(--ink); font-weight:600; font-size:15px}
  .mark img{width:30px; height:30px; object-fit:contain; display:block}
  .bar .meta{display:flex; align-items:center; gap:24px}
  .live{display:inline-flex; align-items:center; gap:8px}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}

  .stage{position:relative; display:grid; place-items:center}
  .stage .fallback{width:min(34vh,220px); height:auto; display:none}
  .no-webgl .stage .fallback{display:block}

  .headline{display:flex; flex-direction:column; align-items:center; text-align:center; padding:8px 0 clamp(20px,3.5vh,40px)}
  h1{
    font-family:"Instrument Serif",Georgia,serif; font-weight:400;
    font-size:clamp(56px,min(11vw,16vh),168px); line-height:1; letter-spacing:-.005em;
    color:var(--ink); padding-bottom:.12em;  /* room for the "g" descender */
  }
  h1 em{font-style:italic; padding-right:.04em; color:transparent;
    background:linear-gradient(180deg,#FFFFFF 0%,#C4F1F6 55%,#6FE3F0 100%);
    -webkit-background-clip:text; background-clip:text}

  .cta{display:flex; justify-content:center; padding-bottom:clamp(24px,6vh,64px)}
  .pilot{
    display:inline-flex; align-items:center; gap:12px; min-height:48px; padding:0 6px 0 20px;
    border-radius:999px; text-decoration:none; color:var(--ink); font-size:15px; font-weight:500;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:border-color .25s, background .25s;
  }
  .pilot b{display:grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--ink); color:#07080C; transition:transform .25s}
  .pilot:hover{border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.08)}
  .pilot:hover b{transform:translateX(3px)}
  .pilot:focus-visible{outline:2px solid var(--accent); outline-offset:4px}

  .reveal{opacity:0; transform:translateY(12px); animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}
  @keyframes in{to{opacity:1; transform:none}}

  @media (prefers-reduced-motion:reduce){
    .grain,.live i,.nebula{animation:none}
    .shoot{display:none}
    .reveal{animation:none; opacity:1; transform:none}
  }
</style>
</head>
<body>
  <div class="nebula" aria-hidden="true"></div>
  <span class="shoot" aria-hidden="true"></span><span class="shoot s2" aria-hidden="true"></span>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="frame">
    <header class="bar reveal d1">
      <div class="mark"><img src="images/logos.png" alt="" width="30" height="30" onerror="this.style.display='none'">Courage Library</div>
      <div class="meta"><span class="live"><i></i>Launching soon</span></div>
    </header>

    <div class="stage" id="stage">
      <img class="fallback" src="images/logos.png" alt="Courage Library logo">
    </div>

    <section class="headline">
      <h1 class="reveal d2">Coming <em>soon</em></h1>
    </section>

    <div class="cta reveal d3">
      <a class="pilot" href="pilot-version.html">Explore the pilot
        <b><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></b>
      </a>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var root=document.documentElement;
  function fallback(){ root.classList.add('no-webgl'); }
  if(!window.THREE){ fallback(); return; }
  var canvas=document.getElementById('scene'), stage=document.getElementById('stage');
  var renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true}); }catch(e){ fallback(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.NoToneMapping;

  var scene=new THREE.Scene();
  var FOV=35, CAM_Z=10;
  var camera=new THREE.PerspectiveCamera(FOV,1,0.1,400);
  camera.position.set(0,0,CAM_Z);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- deep space: stars at real depth, drifting slowly towards the viewer ---------- */
  var STAR_COUNT=window.innerWidth<640?1400:2600, NEAR=-6, FAR=-220;
  var sPos=new Float32Array(STAR_COUNT*3), sSize=new Float32Array(STAR_COUNT), sPhase=new Float32Array(STAR_COUNT), sTint=new Float32Array(STAR_COUNT);
  function placeStar(i,z){
    var spread=Math.abs(z)*0.55+12;
    sPos[i*3]=(Math.random()-.5)*spread*2.2;
    sPos[i*3+1]=(Math.random()-.5)*spread*1.4;
    sPos[i*3+2]=z;
  }
  for(var k=0;k<STAR_COUNT;k++){
    placeStar(k,FAR+Math.random()*(NEAR-FAR));
    sSize[k]=Math.random()<.92?(.6+Math.random()*1.1):(1.8+Math.random()*1.6);
    sPhase[k]=Math.random()*6.283;
    sTint[k]=Math.random();
  }
  var starGeo=new THREE.BufferGeometry();
  starGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
  starGeo.setAttribute('aSize',new THREE.BufferAttribute(sSize,1));
  starGeo.setAttribute('aPhase',new THREE.BufferAttribute(sPhase,1));
  starGeo.setAttribute('aTint',new THREE.BufferAttribute(sTint,1));
  var starMat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0}, uPx:{value:Math.min(window.devicePixelRatio||1,2)}},
    vertexShader:[
      'attribute float aSize; attribute float aPhase; attribute float aTint;',
      'uniform float uTime; uniform float uPx;',
      'varying float vAlpha; varying vec3 vColor;',
      'void main(){',
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);',
      '  float depth=clamp(-mv.z/220.0,0.0,1.0);',
      '  float tw=0.65+0.35*sin(uTime*1.3+aPhase);',
      '  vAlpha=tw*(1.0-depth*0.75)*smoothstep(4.0,14.0,-mv.z);',
      '  vColor=aTint<0.7?vec3(1.0):(aTint<0.86?vec3(0.62,0.96,1.0):vec3(0.72,0.62,1.0));',
      '  gl_PointSize=aSize*uPx*(120.0/-mv.z)+0.6;',
      '  gl_Position=projectionMatrix*mv;',
      '}'].join('\n'),
    fragmentShader:[
      'varying float vAlpha; varying vec3 vColor;',
      'void main(){',
      '  float d=length(gl_PointCoord-0.5);',
      '  float core=pow(smoothstep(0.5,0.0,d),2.2);',
      '  gl_FragColor=vec4(vColor,core*vAlpha);',
      '}'].join('\n')
  });
  var stars=new THREE.Points(starGeo,starMat);
  stars.renderOrder=-1;
  scene.add(stars);

  /* ---------- the Courage Library mark in 3D: cyan triangle in front, violet behind ---------- */
  function softTriangle(r,rad){
    var pts=[];
    for(var i=0;i<3;i++){ var a=i*2*Math.PI/3; pts.push(new THREE.Vector2(Math.cos(a)*r,Math.sin(a)*r)); }
    var s=new THREE.Shape();
    for(var j=0;j<3;j++){
      var p0=pts[(j+2)%3], p1=pts[j], p2=pts[(j+1)%3];
      var a1=p1.clone().add(p0.clone().sub(p1).normalize().multiplyScalar(rad));
      var a2=p1.clone().add(p2.clone().sub(p1).normalize().multiplyScalar(rad));
      if(j===0) s.moveTo(a1.x,a1.y); else s.lineTo(a1.x,a1.y);
      s.quadraticCurveTo(p1.x,p1.y,a2.x,a2.y);
    }
    return s;
  }
  var extrude={depth:.34,bevelEnabled:true,bevelThickness:.16,bevelSize:.14,bevelSegments:24,curveSegments:64};
  var shape=softTriangle(1.45,.95);
  var gFront=new THREE.ExtrudeGeometry(shape,extrude); gFront.center();
  var gBack=new THREE.ExtrudeGeometry(shape,extrude); gBack.center();
  function brand(hex,rough,em){
    var c=new THREE.Color(hex).convertSRGBToLinear();
    return new THREE.MeshPhysicalMaterial({color:c,roughness:rough,metalness:0,clearcoat:1,clearcoatRoughness:.08,emissive:c,emissiveIntensity:em});
  }
  var front=new THREE.Mesh(gFront,brand('#22DCEE',.3,.08));
  var back=new THREE.Mesh(gBack,brand('#4E00E4',.32,.14));
  back.position.set(.36,-.2,-.42);
  var obj=new THREE.Group(); obj.add(back); obj.add(front);
  var group=new THREE.Group(); group.add(obj); scene.add(group);
  var OBJ_H=3.1, OBJ_W=3.4;   // approximate world size of the mark at scale 1

  scene.add(new THREE.HemisphereLight(0xffffff,0x14161f,.55));
  var key=new THREE.DirectionalLight(0xffffff,.9); key.position.set(-4,5,6); scene.add(key);
  var top=new THREE.DirectionalLight(0xffffff,.6); top.position.set(2,6,-2); scene.add(top);
  var rimL=new THREE.PointLight(0xffffff,4,20); rimL.position.set(3,1.5,-3); scene.add(rimL);
  var fill=new THREE.PointLight(0xffffff,1.2,20); fill.position.set(-4,-2,2); scene.add(fill);

  var shCanvas=document.createElement('canvas'); shCanvas.width=shCanvas.height=128;
  var g=shCanvas.getContext('2d'); var grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(0,0,0,.6)'); grd.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=grd; g.fillRect(0,0,128,128);
  var shadow=new THREE.Mesh(new THREE.PlaneGeometry(3.6,.9),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shCanvas),transparent:true,depthWrite:false}));
  shadow.rotation.x=-Math.PI/2*0.92; scene.add(shadow);

  /* ---------- place the 3D mark exactly inside the layout's stage (never over the text) ---------- */
  var start=performance.now(), last=start;
  var baseScale=1, baseY=0, px2w=1;
  var mx=0,my=0,tx=0,ty=0;
  function layout(){
    var w=window.innerWidth, h=window.innerHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    px2w=(2*Math.tan(FOV*Math.PI/360)*CAM_Z)/h;
    var r=stage.getBoundingClientRect();
    var fitH=(r.height*px2w*0.80)/OBJ_H, fitW=(r.width*px2w*(w<640?0.78:0.62))/OBJ_W;
    baseScale=Math.max(.3,Math.min(1.05,fitH,fitW));
    baseY=(h/2-(r.top+r.height/2))*px2w;
    group.scale.setScalar(baseScale);
    shadow.scale.setScalar(baseScale);
    shadow.position.y=baseY-OBJ_H*.5*baseScale-.12;
    if(reduce) draw(0);
  }
  window.addEventListener('resize',layout);
  if(window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
  layout();

  window.addEventListener('pointermove',function(e){ mx=(e.clientX/window.innerWidth-.5); my=(e.clientY/window.innerHeight-.5); });

  function draw(t,dt){
    tx+=(mx-tx)*.04; ty+=(my-ty)*.04;
    obj.rotation.y=-.38+Math.sin(t*.35)*.32+tx*.7;
    obj.rotation.x=.14+Math.sin(t*.27)*.1+ty*.45;
    obj.rotation.z=Math.sin(t*.2)*.05;
    var bob=reduce?0:Math.sin(t*.8)*.08;
    group.position.set(tx*.3*baseScale, baseY+bob*baseScale, 0);
    shadow.material.opacity=.9-bob*1.5;
    starMat.uniforms.uTime.value=t;
    if(dt){
      for(var q=0;q<STAR_COUNT;q++){ var zi=q*3+2; sPos[zi]+=2.2*dt; if(sPos[zi]>NEAR) placeStar(q,FAR); }
      starGeo.attributes.position.needsUpdate=true;
    }
    stars.rotation.z=t*.004;
    stars.position.x=-tx*1.6; stars.position.y=ty*1.0;
    renderer.render(scene,camera);
  }
  function frame(now){
    var dt=Math.min((now-last)/1000,.05); last=now;
    draw((now-start)/1000, dt);
    requestAnimationFrame(frame);
  }
  if(reduce) draw(0); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>

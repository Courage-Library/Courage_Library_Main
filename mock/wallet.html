<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CL Coin Wallet | Courage Library</title>
  <link rel="icon" type="image/png" href="../images/logo.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Sora', sans-serif;
      background: #eef2f9;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Hero ── */
    .wallet-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #1a1d6e 100%);
      padding: 32px 24px 72px;
      position: relative;
      overflow: hidden;
    }
    .wallet-hero::before {
      content: '';
      position: absolute;
      width: 380px; height: 380px;
      background: rgba(0,208,200,0.07);
      border-radius: 50%;
      right: -100px; top: -120px;
      pointer-events: none;
    }
    .wallet-hero::after {
      content: '';
      position: absolute;
      width: 220px; height: 220px;
      background: rgba(251,191,36,0.06);
      border-radius: 50%;
      left: -50px; bottom: -70px;
      pointer-events: none;
    }
    .hero-inner {
      position: relative; z-index: 1;
      max-width: 800px; margin: 0 auto;
    }

    /* ── Cards ── */
    .wcard {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e2e8f4;
      box-shadow: 0 4px 24px rgba(15,23,42,.08);
      overflow: hidden;
    }
    .wcard-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wcard-title {
      font-family: 'Syne', sans-serif;
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #475569;
    }

    /* ── Stat pills ── */
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      min-width: 0;
    }
    .stat-row > * {
      min-width: 0;
    }
    .stat-pill {
      background: #f8fafc;
      border: 1px solid #e2e8f4;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-pill .val {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1rem, 4.5vw, 1.45rem);
      font-weight: 800;
      color: #0f172a;
      line-height: 1;
    }
    .stat-pill .lbl {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #94a3b8;
    }

    /* ── Transaction log ── */
    .tx-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 20px;
      border-bottom: 0.5px solid #f1f5f9;
      transition: background .12s;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-row:hover { background: #f8fafc; }
    .tx-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .tx-label { font-size: .8rem; font-weight: 600; color: #1e293b; }
    .tx-time  { font-size: .65rem; color: #94a3b8; margin-top: 1px; }
    .tx-amount {
      margin-left: auto;
      font-family: 'Syne', sans-serif;
      font-size: .85rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .tx-earn { color: #059669; }
    .tx-spend { color: #dc2626; }

    /* ── Progress ring ── */
    .ring-wrap {
      position: relative;
      width: 120px; height: 120px;
      flex-shrink: 0;
    }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-center {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
    }

    /* ── Sparkline ── */
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 56px;
    }
    .bar-day {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .bar-fill {
      width: 100%;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, #00d8d0, #00bdb5);
      min-height: 3px;
      transition: height .4s ease;
    }
    .bar-lbl {
      font-size: .58rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ── Skeleton loader ── */
    .skel {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f4 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skel-shine 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes skel-shine {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: #94a3b8;
    }
    .empty-state .emoji { font-size: 2.2rem; margin-bottom: 8px; }
    .empty-state .msg   { font-size: .82rem; font-weight: 600; }

    /* ── Back link ── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .75rem; font-weight: 700;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      margin-bottom: 20px;
      transition: color .15s;
    }
    .back-btn:hover { color: #fff; }

    /* ── Forecast badge ── */
    .forecast-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,208,200,0.12);
      border: 0.5px solid rgba(0,208,200,0.3);
      color: #00bdb5;
      font-size: .7rem; font-weight: 700;
      padding: 4px 10px; border-radius: 100px;
      font-family: 'Syne', sans-serif;
    }

    @media (max-width: 520px) {
      .stat-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<script>
const SUPABASE_URL   = "https://sgagswxzsxlgcspwiuoh.supabase.co";
const SUPABASE_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnYWdzd3h6c3hsZ2NzcHdpdW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5NTA1NTIsImV4cCI6MjA2OTUyNjU1Mn0.ZNfk5WNDPkjKcFsRO48rEYk3dhbLYm_m21aZ-wfywo4";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const REWARDS = [
  { name: 'Courage Bottle', cost: 1800 },
  { name: 'Courage Diary',  cost: 3000 },
  { name: 'Courage T-Shirt', cost: 5000 },
];

let _userId = null;
let _totalCoins = 0;
let _txOffset = 0;
const TX_PAGE = 25;

// ── Helpers ────────────────────────────────────────────────────────────
function fmt(n) { return Number(n || 0).toLocaleString('en-IN'); }
function timeAgo(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60)    return 'just now';
  if (d < 3600)  return `${Math.floor(d/60)}m ago`;
  if (d < 86400) return `${Math.floor(d/3600)}h ago`;
  if (d < 604800) return `${Math.floor(d/86400)}d ago`;
  return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}
function istDate(iso) {
  return new Date(iso).toLocaleDateString('en-CA', { timeZone:'Asia/Kolkata' });
}
function animCount(from, to, dur, el) {
  if (!el) return;
  const s = performance.now();
  const d = to - from;
  if (d === 0) { el.textContent = fmt(to); return; }
  (function tick(now) {
    const p = Math.min((now - s) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(from + d * e));
    if (p < 1) requestAnimationFrame(tick);
  })(performance.now());
}

// ── TX icon by type ────────────────────────────────────────────────────
const TX_META = {
  mock_submit:  { icon:'📝', bg:'rgba(59,130,246,.1)',  label:'Mock Test' },
  streak_bonus: { icon:'🔥', bg:'rgba(251,146,60,.1)',  label:'Streak Bonus' },
  referral:     { icon:'🎉', bg:'rgba(52,211,153,.1)',  label:'Referral Reward' },
  reward_claim: { icon:'🎁', bg:'rgba(139,92,246,.1)',  label:'Reward Claim' },
  level_up:     { icon:'⭐', bg:'rgba(245,158,11,.1)',  label:'Level Up Bonus' },
  signup:       { icon:'🚀', bg:'rgba(16,185,129,.1)',  label:'Signup Bonus' },
};
function txMeta(type) {
  return TX_META[type] || { icon:'🪙', bg:'rgba(100,116,139,.1)', label: type || 'Transaction' };
}

// ── INIT ───────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    document.body.innerHTML = `<div style="padding:60px;text-align:center;color:#64748b;font-size:1rem">
      Please <a href="dashboard.html" style="color:#1d4ed8">log in</a> to view your wallet.</div>`;
    return;
  }
  _userId = user.id;
  await Promise.all([loadProfile(), load7Day(), loadTx()]);
});

// ── Profile & hero stats ───────────────────────────────────────────────
async function loadProfile() {
  const { data: p } = await db
    .from('user_profiles')
    .select('total_coins, lifetime_coins')
    .eq('id', _userId)
    .single();
  if (!p) return;
  _totalCoins = p.total_coins || 0;
  animCount(0, _totalCoins, 800, document.getElementById('heroTotal'));
  updateProgressRing(_totalCoins);
  renderWalletLevel(p.lifetime_coins || p.total_coins || 0);
}

function getLevelFromLifetimeCoins(coins) {
  if (coins >= 6000) return { label: "Legend",   color: "#f59e0b", bg: "rgba(245,158,11,0.25)", border: "rgba(245,158,11,0.5)" };
  if (coins >= 3000) return { label: "Luminary",  color: "#c084fc", bg: "rgba(168,85,247,0.25)",  border: "rgba(168,85,247,0.5)" };
  if (coins >= 1000) return { label: "Scholar",   color: "#38bdf8", bg: "rgba(0,168,255,0.22)",   border: "rgba(0,168,255,0.45)" };
  return               { label: "Seeker",    color: "#a0a0e0", bg: "rgba(80,80,180,0.22)",   border: "rgba(80,80,180,0.45)" };
}

function renderWalletLevel(lifetimeCoins) {
  const TIERS = [
    { label: "Seeker",   min: 0,    max: 1000 },
    { label: "Scholar",  min: 1000, max: 3000 },
    { label: "Luminary", min: 3000, max: 6000 },
    { label: "Legend",   min: 6000, max: null  },
  ];
  const { label, color, bg, border } = getLevelFromLifetimeCoins(lifetimeCoins);
  const currentTier = TIERS.find(t => t.label === label);
  const nextTier    = TIERS.find(t => t.min === currentTier?.max);

  // Badge pill
  const badgeEl = document.getElementById('walletLevelBadge');
  if (badgeEl) {
    badgeEl.style.background = bg;
    badgeEl.style.borderColor = border;
    badgeEl.style.color = color;
    badgeEl.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 64 64"><use href="#badge-${label.toLowerCase()}"/></svg>
      ${label}`;
  }

  // Progress bar
  const lbl = document.getElementById('walletLevelLabel');
  const pct = document.getElementById('walletLevelPct');
  const bar = document.getElementById('walletLevelBar');
  if (lbl && pct && bar) {
    if (nextTier) {
      const range    = currentTier.max - currentTier.min;
      const progress = Math.min(lifetimeCoins - currentTier.min, range);
      const percent  = Math.round((progress / range) * 100);
      const left     = (currentTier.max - lifetimeCoins).toLocaleString('en-IN');
      lbl.textContent = `${left} CL to ${nextTier.label}`;
      pct.textContent = `${percent}%`;
    } else {
      lbl.textContent = 'Maximum tier reached 🏆';
      pct.textContent = '100%';
    }
    bar.style.background = color;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const range   = nextTier ? (currentTier.max - currentTier.min) : 1;
        const prog    = nextTier ? Math.min(lifetimeCoins - currentTier.min, range) : range;
        bar.style.width = Math.round((prog / range) * 100) + '%';
      });
    });
  }
}

function updateProgressRing(coins) {
  const next = REWARDS.find(r => r.cost > coins) || REWARDS[REWARDS.length - 1];
  const prev = REWARDS.filter(r => r.cost <= coins).pop();
  const base  = prev ? prev.cost : 0;
  const range = next.cost - base;
  const pct   = Math.min(100, Math.round(((coins - base) / range) * 100));
  const offset = 314 - (314 * pct / 100);

  document.getElementById('ringProgress').style.strokeDashoffset = offset;
  document.getElementById('ringPct').textContent = pct + '%';
  document.getElementById('nextRewardName').textContent = next.name;
  document.getElementById('nextRewardCoins').textContent =
    `${fmt(coins)} / ${fmt(next.cost)} CL`;
}

// ── 7-day bar chart ────────────────────────────────────────────────────
async function load7Day() {
  const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const days = [], labels = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ist = d.toLocaleDateString('en-CA', { timeZone:'Asia/Kolkata' });
    days.push(ist);
    labels.push(dayNames[new Date(ist + 'T12:00:00').getDay()]);
  }

  const { data: rows } = await db
    .from('coin_transactions')
    .select('coins, created_at')
    .eq('user_id', _userId)
    .gt('coins', 0)
    .gte('created_at', days[0] + 'T00:00:00+05:30')
    .lte('created_at', days[6] + 'T23:59:59+05:30');

  const dayMap = {};
  days.forEach(d => dayMap[d] = 0);
  (rows || []).forEach(r => {
    const d = istDate(r.created_at);
    if (dayMap[d] !== undefined) dayMap[d] += (r.coins || 0);
  });

  const values = days.map(d => dayMap[d]);
  const max    = Math.max(...values, 1);
  const weekTotal = values.reduce((s, v) => s + v, 0);
  const avg = Math.round(weekTotal / 7);

  // Bar chart
  const bc = document.getElementById('barChart');
  bc.innerHTML = values.map((v, i) => {
    const heightPct = Math.max(4, (v / max) * 100);
    const isToday = i === 6;
    return `
      <div class="bar-day">
        <div style="font-size:.6rem;font-weight:700;color:${v > 0 ? '#0f172a' : '#94a3b8'};
                    margin-bottom:2px;font-family:'Syne',sans-serif;min-height:12px">
          ${v > 0 ? fmt(v) : ''}
        </div>
        <div class="bar-fill" style="
          height:${heightPct}%;
          background:${isToday
            ? 'linear-gradient(180deg,#f59e0b,#b45309)'
            : v > 0
              ? 'linear-gradient(180deg,#00d8d0,#00bdb5)'
              : '#e2e8f4'};
        "></div>
        <div class="bar-lbl" style="color:${isToday ? '#b45309' : '#94a3b8'}">${labels[i]}</div>
      </div>`;
  }).join('');

  // Hero week total
  animCount(0, weekTotal, 700, document.getElementById('heroWeek'));

  // Weekly avg badge
  if (avg > 0) {
    document.getElementById('weeklyAvgText').textContent = fmt(avg);
    document.getElementById('weeklyAvgBadge').style.display = 'inline-flex';
  }

  // Monthly forecast = avg * 30
  const forecast = avg * 30;
  animCount(0, forecast, 700, document.getElementById('heroForecast'));

  // Days to next reward goal
  const next = REWARDS.find(r => r.cost > _totalCoins) || REWARDS[REWARDS.length - 1];
  const needed = Math.max(0, next.cost - _totalCoins);
  if (avg > 0 && needed > 0) {
    const days_left = Math.ceil(needed / avg);
    document.getElementById('daysToGoalText').textContent =
      `~${days_left} day${days_left !== 1 ? 's' : ''} at current pace`;
    document.getElementById('daysToGoal').style.display = 'inline-flex';
  }
}

// ── Transaction log ────────────────────────────────────────────────────
async function loadTx(append = false) {
  const { data: rows, count } = await db
    .from('coin_transactions')
    .select('*', { count: 'exact' })
    .eq('user_id', _userId)
    .order('created_at', { ascending: false })
    .range(_txOffset, _txOffset + TX_PAGE - 1);

  if (!append) {
    document.getElementById('txList').innerHTML = '';
    document.getElementById('txCount').textContent = count ? `${fmt(count)} transactions` : '';
  }

  if (!rows || rows.length === 0) {
    if (!append) {
      document.getElementById('txList').innerHTML = `
        <div class="empty-state">
          <div class="emoji">🪙</div>
          <div class="msg">No transactions yet. Take your first mock test!</div>
        </div>`;
    }
    return;
  }

  const list = document.getElementById('txList');
  rows.forEach(r => {
    const isEarn  = r.coins > 0;
    const m       = txMeta(r.transaction_type);
    const label   = r.description || m.label;
    const row     = document.createElement('div');
    row.className = 'tx-row';
    row.innerHTML = `
      <div class="tx-icon" style="background:${m.bg}">${m.icon}</div>
      <div style="flex:1;min-width:0">
        <div class="tx-label">${label}</div>
        <div class="tx-time">${timeAgo(r.created_at)}</div>
      </div>
      <div class="tx-amount ${isEarn ? 'tx-earn' : 'tx-spend'}">
        ${isEarn ? '+' : ''}${fmt(r.coins)} CL
      </div>`;
    list.appendChild(row);
  });

  _txOffset += rows.length;

  // Load more button
  const lmw = document.getElementById('loadMoreWrap');
  if (_txOffset < (count || 0)) {
    lmw.style.display = 'block';
  } else {
    lmw.style.display = 'none';
  }
}

async function loadMore() {
  document.getElementById('loadMoreBtn').textContent = 'Loading…';
  await loadTx(true);
  document.getElementById('loadMoreBtn').textContent = 'Load more';
}

// Refresh balance when the user tabs back to this page (e.g. after earning coins on result page)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && _userId) {
    client.from('user_profiles')
      .select('total_coins, lifetime_coins')
      .eq('id', _userId)
      .single()
      .then(({ data }) => {
        if (!data) return;
        const fmt = n => (n || 0).toLocaleString('en-IN');
        const heroEl = document.getElementById('heroTotal');
        if (heroEl) heroEl.textContent = fmt(data.total_coins);
      });
  }
});
</script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result | Courage Library</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap');

        :root {
            --brand:       #1a56db;
            --brand-dark:  #1e40af;
            --brand-light: #eff6ff;
            --green:       #16a34a;
            --green-light: #f0fdf4;
            --red:         #dc2626;
            --red-light:   #fef2f2;
            --amber:       #d97706;
            --amber-light: #fffbeb;
            --border:      #e2e8f0;
            --text:        #0f172a;
            --muted:       #64748b;
            --radius:      16px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', inherit, sans-serif;
            background: #f1f5fb;
            min-height: 100vh;
            color: var(--text);
        }

        h1, h2, h3, .score-num { font-family: 'Sora', sans-serif; }

        /* ── RIPPLE ── */
        .ripple { position: relative; overflow: hidden; }
        .ripple::after {
            content: ''; display: block; position: absolute;
            border-radius: 50%; width: 100%; height: 100%;
            top: 0; left: 0; pointer-events: none;
            background: rgba(59,130,246,.2); opacity: 0;
            transition: opacity .6s, transform .6s; transform: scale(.5);
        }
        .ripple:active::after { opacity: 1; transform: scale(1.2); transition: 0s; }

        /* ── KEYFRAMES ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes scoreReveal {
            from { opacity: 0; transform: scale(.65); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes popIn {
            0%   { transform: scale(.5); opacity: 0; }
            70%  { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .fade-up { animation: fadeUp .45s ease both; }
        .s1 { animation-delay: .04s; }
        .s2 { animation-delay: .12s; }
        .s3 { animation-delay: .20s; }

        /* ── SCORE HERO ── */
        .score-hero {
            background: linear-gradient(140deg, #1a56db 0%, #1e3a8a 55%, #172554 100%);
            border-radius: 20px;
            padding: 32px 16px 28px;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 56px rgba(26,86,219,.38);
        }
        @media (min-width: 480px) {
            .score-hero { padding: 48px 32px 38px; border-radius: 24px; }
        }
        .score-hero::before {
            content: '';
            position: absolute; top: -70px; right: -70px;
            width: 240px; height: 240px;
            background: rgba(255,255,255,.055); border-radius: 50%;
        }
        .score-hero::after {
            content: '';
            position: absolute; bottom: -90px; left: -50px;
            width: 300px; height: 300px;
            background: rgba(255,255,255,.035); border-radius: 50%;
        }
        .score-hero > * { position: relative; z-index: 1; }

        .score-label {
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .65;
            margin-bottom: 10px;
        }
        .score-num {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            animation: scoreReveal .55s cubic-bezier(.34,1.56,.64,1) both;
            animation-delay: .18s;
        }
        @media (min-width: 480px) {
            .score-num { font-size: 5.5rem; }
        }
        .score-denom {
            font-size: 1rem;
            opacity: .5;
            margin-top: 7px;
            font-family: 'DM Sans', sans-serif;
        }

        /* verdict badge */
        .verdict-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 7px 20px;
            border-radius: 100px;
            font-size: .82rem;
            font-weight: 700;
            animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
            animation-delay: .5s;
        }
        .verdict-excellent { background: rgba(22,163,74,.22);  color: #bbf7d0; border: 1px solid rgba(22,163,74,.38); }
        .verdict-good      { background: rgba(59,130,246,.22); color: #bfdbfe; border: 1px solid rgba(59,130,246,.38); }
        .verdict-average   { background: rgba(217,119,6,.22);  color: #fde68a; border: 1px solid rgba(217,119,6,.38); }
        .verdict-poor      { background: rgba(220,38,38,.22);  color: #fca5a5; border: 1px solid rgba(220,38,38,.38); }

        /* ── STAT CHIPS (inside hero) ── */
        .stat-row {
            display: flex;
            flex-direction: row;
            gap: 6px;
            margin-top: 22px;
            width: 100%;
        }
        .stat-chip {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,.11);
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 11px;
            padding: 10px 4px 9px;
            text-align: center;
        }
        .stat-chip .sc-icon {
            font-size: .75rem;
            opacity: .75;
            margin-bottom: 5px;
        }
        .stat-chip .sc-val {
            font-family: 'Sora', sans-serif;
            font-size: clamp(.72rem, 2.8vw, 1.15rem);
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }
        .stat-chip .sc-lbl {
            font-size: .48rem;
            opacity: .6;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        /* larger on wider screens */
        @media (min-width: 480px) {
            .stat-row { gap: 10px; }
            .stat-chip { padding: 13px 8px 11px; border-radius: 13px; }
            .stat-chip .sc-val { font-size: 1.4rem; }
            .stat-chip .sc-lbl { font-size: .6rem; }
            .stat-chip .sc-icon { font-size: .85rem; }
        }
        .scv-green { color: #86efac; }
        .scv-red   { color: #fca5a5; }
        .scv-sky   { color: #bae6fd; }
        .scv-amber { color: #fde68a; }
        .scv-white { color: #fff; }

        /* ── ACTION BUTTONS ── */
        .action-row {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }
        /* Mobile: icon-only circles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px; height: 44px;
            border-radius: 50%;
            padding: 0;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: transform .15s, box-shadow .15s, background .15s;
            text-decoration: none;
            font-family: 'Sora', sans-serif;
            flex-shrink: 0;
            letter-spacing: .01em;
        }
        .btn-label { display: none; }
        .btn:hover { transform: translateY(-2px); }
        /* Desktop: icon + label */
        @media (min-width: 400px) {
            .btn {
                width: auto; height: auto;
                border-radius: 10px;
                padding: 9px 15px;
                font-size: .78rem;
                gap: 6px;
            }
            .btn-label { display: inline; }
            .action-row { gap: 8px; }
        }
        @media (min-width: 480px) {
            .btn { padding: 11px 20px; font-size: .84rem; gap: 8px; }
            .action-row { gap: 10px; margin-top: 28px; }
        }
        .btn-white {
            background: rgba(255,255,255,.15);
            color: #fff;
            border: 1.5px solid rgba(255,255,255,.3);
            backdrop-filter: blur(4px);
        }
        .btn-white:hover { background: rgba(255,255,255,.25); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
        .btn-outline-white {
            background: #fff;
            color: var(--brand-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }
        .btn-outline-white:hover { background: #f0f6ff; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
        .btn-whatsapp {
            background: #25d366;
            color: #fff;
            box-shadow: 0 2px 8px rgba(37,211,102,.35);
        }
        .btn-whatsapp:hover { background: #1fb855; box-shadow: 0 6px 20px rgba(37,211,102,.45); }

        /* ── INFO CARD ── */
        .info-card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 18px 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        @media (min-width: 480px) {
            .info-card { padding: 24px 26px; }
        }
        .info-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .title-icon {
            width: 32px; height: 32px;
            border-radius: 9px;
            background: var(--brand-light);
            color: var(--brand);
            display: flex; align-items: center; justify-content: center;
            font-size: .84rem;
            flex-shrink: 0;
        }

        /* ── SECTION ACCURACY BARS ── */
        .sub-bar { margin-bottom: 16px; }
        .sub-bar:last-child { margin-bottom: 0; }
        .sub-bar-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .78rem;
            font-weight: 600;
            margin-bottom: 6px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sub-bar-head > span:first-child {
            flex: 1;
            min-width: 0;
        }
        .sub-bar-tag {
            font-size: .62rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 100px;
            white-space: nowrap;
        }
        .tag-strong  { background: #dcfce7; color: #15803d; }
        .tag-average { background: #fef3c7; color: #92400e; }
        .tag-weak    { background: #fee2e2; color: #b91c1c; }
        .bar-track {
            height: 10px;
            background: #eef2f7;
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 1.1s cubic-bezier(.4,0,.2,1);
        }

        /* ── FILTER TABS ── */
        .review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .review-header h2 { font-size: 1.1rem; font-weight: 700; }

        .filter-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            margin-bottom: 18px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .ftab {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: .75rem;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--muted);
            transition: all .15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ftab:hover { border-color: #94a3b8; color: var(--text); }
        .ftab-count {
            background: #f1f5f9;
            color: var(--muted);
            border-radius: 999px;
            padding: 1px 7px;
            font-size: .68rem;
            font-weight: 800;
        }
        .ftab.active-all     { background: var(--brand); color: #fff; border-color: var(--brand); }
        .ftab.active-correct { background: var(--green); color: #fff; border-color: var(--green); }
        .ftab.active-wrong   { background: var(--red);   color: #fff; border-color: var(--red);   }
        .ftab.active-skipped { background: #64748b;      color: #fff; border-color: #64748b;      }
        .ftab.active-all .ftab-count,
        .ftab.active-correct .ftab-count,
        .ftab.active-wrong .ftab-count,
        .ftab.active-skipped .ftab-count { background: rgba(255,255,255,.25); color: #fff; }

        /* ── QUESTION CARDS ── */
        .q-card {
            border-radius: 14px;
            border: 1px solid var(--border);
            border-left-width: 4px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.04);
            transition: box-shadow .2s;
        }
        .q-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.09); }
        .q-card.correct { border-left-color: #2563eb; background: #f8fbff; }
        .q-card.wrong   { border-left-color: #2563eb; background: #fff8f8; }
        .q-card.skipped { border-left-color: #2563eb; background: #fff;    }

        .q-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 18px 9px;
            gap: 10px;
        }
        .q-meta { display: flex; align-items: center; gap: 8px; }
        .q-num {
            font-size: .72rem;
            font-weight: 800;
            color: var(--muted);
            letter-spacing: .05em;
            text-transform: uppercase;
        }
        .q-section-tag {
            font-size: .65rem;
            font-weight: 600;
            background: var(--brand-light);
            color: var(--brand);
            padding: 2px 8px;
            border-radius: 100px;
        }
        .q-status-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: .65rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 100px;
            letter-spacing: .04em;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .chip-correct { background: var(--green-light); color: var(--green); }
        .chip-wrong   { background: var(--red-light);   color: var(--red);   }
        .chip-skipped { background: #f1f5f9;            color: #64748b;      }

        .q-text {
            padding: 2px 18px 14px;
            font-size: .9rem;
            font-weight: 600;
            line-height: 1.65;
            color: var(--text);
        }

        .q-options {
            padding: 0 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .q-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1.5px solid #edf0f5;
            font-size: .84rem;
            background: #f8fafc;
            color: var(--text);
            transition: background .12s;
        }
        .q-option.opt-correct {
            background: #f0fdf4;
            border-color: #86efac;
        }
        .q-option.opt-wrong {
            background: #fff5f5;
            border-color: #fca5a5;
        }

        .opt-key {
            font-weight: 800;
            font-size: .75rem;
            min-width: 24px; height: 24px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            background: #e2e8f0;
            color: var(--muted);
            flex-shrink: 0;
        }
        .opt-key.key-correct { background: var(--green); color: #fff; }
        .opt-key.key-wrong   { background: var(--red);   color: #fff; }

        .q-footer {
            padding: 10px 16px 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            background: #fafbfc;
        }
        .qa-item { font-size: .78rem; color: var(--muted); }
        .qa-item strong { font-weight: 700; color: var(--text); }
        .qa-correct-ans { color: var(--green); font-weight: 700; }

        .q-explanation {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: #f0f7ff;
            border-top: 1px solid #bfdbfe;
            padding: 11px 16px;
            font-size: .81rem;
            color: #1e40af;
            line-height: 1.6;
        }
        .exp-icon { color: #60a5fa; margin-top: 2px; flex-shrink: 0; }

        /* ── SKELETON ── */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }

        /* ── EMPTY FILTER STATE ── */
        .empty-filter {
            text-align: center;
            padding: 44px 20px;
        }
        .empty-filter .ef-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            color: #94a3b8;
            margin: 0 auto 14px;
        }
        .empty-filter p { font-size: .88rem; color: var(--muted); }
    </style>

    <div class="flex-grow">
        <section class="py-6 px-3 max-w-4xl mx-auto">

            <!-- ── SCORE HERO ── -->
            <div class="score-hero fade-up s1">
                <div class="score-label">Your Score</div>
                <div class="score-num" id="score">—</div>
                <div class="score-denom" id="scoreDenom"></div>
                <div class="verdict-badge" id="verdictBadge" style="display:none"></div>

                <!-- 5 stat chips -->
                <div class="stat-row">
                    <div class="stat-chip">
                        <div class="sc-icon"><i class="fas fa-check-circle scv-green"></i></div>
                        <div class="sc-val scv-green" id="correctCount">—</div>
                        <div class="sc-lbl">Correct</div>
                    </div>
                    <div class="stat-chip">
                        <div class="sc-icon"><i class="fas fa-times-circle scv-red"></i></div>
                        <div class="sc-val scv-red" id="wrongCount">—</div>
                        <div class="sc-lbl">Wrong</div>
                    </div>
                    <div class="stat-chip">
                        <div class="sc-icon"><i class="fas fa-minus-circle scv-sky"></i></div>
                        <div class="sc-val scv-sky" id="skippedCount">—</div>
                        <div class="sc-lbl">Skipped</div>
                    </div>
                    <div class="stat-chip">
                        <div class="sc-icon"><i class="fas fa-bullseye scv-amber"></i></div>
                        <div class="sc-val scv-amber" id="accuracy">—</div>
                        <div class="sc-lbl">Accuracy</div>
                    </div>
                    <div class="stat-chip">
                        <div class="sc-icon"><i class="fas fa-clock scv-white"></i></div>
                        <div class="sc-val scv-white" id="timeTaken">—</div>
                        <div class="sc-lbl">Time Taken</div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="action-row">
                    <a href="/mock/dashboard.html" class="btn btn-white">
                        <i class="fas fa-th-large"></i>
                        <span class="btn-label">Dashboard</span>
                    </a>
                    <a href="#" class="btn btn-outline-white" id="leaderboardBtn">
                        <i class="fas fa-trophy"></i>
                        <span class="btn-label">Leaderboard</span>
                    </a>
                    <button class="btn btn-whatsapp" onclick="shareResult()">
                        <i class="fab fa-whatsapp"></i>
                        <span class="btn-label">Share Score</span>
                    </button>
                </div>
            </div>

            <!-- ── SECTION-WISE ACCURACY ── -->
            <div class="info-card mt-5 fade-up s2" id="sectionAccuracyCard" style="display:none">
                <div class="info-card-title">
                    <span class="title-icon"><i class="fas fa-chart-bar"></i></span>
                    Section-wise Accuracy
                </div>
                <div id="sectionBars"></div>
            </div>

            <!-- ── QUESTION REVIEW ── -->
            <div class="mt-7 fade-up s3">
                <div class="review-header">
                    <h2>Question Review</h2>
                    <span class="text-sm text-gray-400" id="reviewSubtitle"></span>
                </div>

                <!-- Filter tabs with live counts -->
                <div class="filter-tabs">
                    <button class="ftab active-all" onclick="filterReview('all', this)">
                        <i class="fas fa-list-ul"></i> All
                        <span class="ftab-count" id="cnt-all">—</span>
                    </button>
                    <button class="ftab" onclick="filterReview('correct', this)">
                        <i class="fas fa-check"></i> Correct
                        <span class="ftab-count" id="cnt-correct">—</span>
                    </button>
                    <button class="ftab" onclick="filterReview('wrong', this)">
                        <i class="fas fa-times"></i> Wrong
                        <span class="ftab-count" id="cnt-wrong">—</span>
                    </button>
                    <button class="ftab" onclick="filterReview('skipped', this)">
                        <i class="fas fa-minus"></i> Skipped
                        <span class="ftab-count" id="cnt-skipped">—</span>
                    </button>
                </div>

                <!-- Review list (skeleton while loading) -->
                <div id="reviewSection">
                    <div class="q-card skipped" style="padding:20px 20px 20px 24px">
                        <div class="skeleton" style="height:13px;width:32%;margin-bottom:12px"></div>
                        <div class="skeleton" style="height:12px;width:82%;margin-bottom:8px"></div>
                        <div class="skeleton" style="height:12px;width:62%"></div>
                    </div>
                    <div class="q-card skipped" style="padding:20px 20px 20px 24px">
                        <div class="skeleton" style="height:13px;width:26%;margin-bottom:12px"></div>
                        <div class="skeleton" style="height:12px;width:76%;margin-bottom:8px"></div>
                        <div class="skeleton" style="height:12px;width:55%"></div>
                    </div>
                </div>
            </div>

        </section>
    </div>

    <script src="/js/resultEngine.js"></script>

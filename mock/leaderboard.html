<html lang="en">

<head>

    <title>Leaderboard | Courage Library</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #fff;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(200, 200, 255, 0.12);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        .glass-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.9);
            border-color: #bfdbfe;
        }

        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple:after {
            content: '';
            display: block;
            position: absolute;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background: rgba(59, 130, 246, 0.2);
            opacity: 0;
            transition: opacity 0.6s, transform 0.6s;
            transform: scale(0.5);
        }

        .ripple:active:after {
            opacity: 1;
            transform: scale(1.2);
            transition: 0s;
        }

        .fade-in {
            animation: fadeIn 1.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .trial-tag {
            background: linear-gradient(135deg, #f59e0b, #f97316);
        }

        /* course card icon circle */
        .icon-circle {
            background: linear-gradient(145deg, #dbeafe, #eff6ff);
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-size: 28px;
            box-shadow: 0 8px 16px -6px #93c5fd;
        }

        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap');

  .lb-hero {
    background: linear-gradient(135deg, #1E40AF 0%, #2563EB 55%, #4338CA 100%);
    position: relative;
    overflow: hidden;
  }
  .lb-hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 85% 15%, rgba(99,102,241,.1) 0%, transparent 65%),
      radial-gradient(ellipse 50% 55% at 10% 85%, rgba(37,99,235,.08) 0%, transparent 65%);
    pointer-events: none;
  }
  .lb-hero::after {
    content: '';
    position: absolute; bottom: -1px; left: 0; right: 0; height: 56px;
    background: #F4F6FB;
    clip-path: ellipse(55% 100% at 50% 100%);
  }

  /* PODIUM */
  .lb-podium-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    padding: 0 4px;
  }

  .lb-podium-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-radius: 18px;
    padding: 18px 10px 0;
    position: relative;
    transition: transform .3s;
    cursor: default;
    /* Equal width for all three — prevents cramped cards */
    flex: 1;
    max-width: 120px;
    min-width: 0;
  }
  .lb-podium-card:hover { transform: translateY(-4px); }
  .lb-podium-card.r1 { background: linear-gradient(160deg,#FFF9EC,#FFEFC2); border: 2px solid #F5A623; box-shadow: 0 16px 40px -10px rgba(245,166,35,.3); }
  .lb-podium-card.r2 { background: linear-gradient(160deg,#F8FAFF,#E8EDF8); border: 2px solid #A8B8C8; box-shadow: 0 12px 30px -10px rgba(100,116,139,.22); }
  .lb-podium-card.r3 { background: linear-gradient(160deg,#FFF5F0,#FFE8DC); border: 2px solid #CD7F32; box-shadow: 0 10px 28px -10px rgba(205,127,50,.22); }

  /* Avatar — same size for all, simpler */
  .lb-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 1.1rem; color: white;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .r1 .lb-avatar { background: linear-gradient(135deg,#F5A623,#E07B00); width:60px; height:60px; font-size:1.25rem; }
  .r2 .lb-avatar { background: linear-gradient(135deg,#94A3B8,#64748B); }
  .r3 .lb-avatar { background: linear-gradient(135deg,#CD7F32,#A0522D); }

  .lb-crown { position:absolute; top:-20px; font-size:1.6rem; animation: lb-float 3s ease-in-out infinite; }
  @keyframes lb-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

  /* Podium body — name + score, nothing else */
  .lb-podium-body {
    width: 100%;
    text-align: center;
    padding: 0 4px;
    margin-bottom: 10px;
  }
  .lb-podium-name {
    font-weight: 700;
    font-size: .78rem;
    line-height: 1.2;
    color: #1E293B;
    /* Single line with ellipsis — NO wrapping */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    display: block;
  }
  .lb-podium-score {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
    color: #1E40AF;
    margin-top: 4px;
    line-height: 1;
  }
  .lb-podium-score-label {
    font-size: .62rem;
    color: #94A3B8;
    margin-top: 1px;
    letter-spacing: .03em;
  }

  .lb-podium-base {
    width: 100%;
    border-radius: 0 0 14px 14px;
    margin-top: auto;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 1.25rem; color: white;
    padding: 8px 0;
  }
  .r1 .lb-podium-base { background: linear-gradient(135deg,#F5A623,#E07B00); height: 64px; }
  .r2 .lb-podium-base { background: linear-gradient(135deg,#A8B8C8,#7A8FA0); height: 52px; }
  .r3 .lb-podium-base { background: linear-gradient(135deg,#CD7F32,#9A5E1E); height: 44px; }

  /* RANK ROWS */
  .lb-row {
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-radius:14px; background:#fff; border:1px solid #E2E8F0;
    transition: all .2s; opacity:0; transform:translateX(-14px);
    animation: lb-slide .4s ease forwards;
  }
  .lb-row:hover { border-color:#BFDBFE; box-shadow:0 6px 20px -6px rgba(37,99,235,.12); transform:translateX(4px) !important; }
  .lb-row.lb-you { background:linear-gradient(135deg,#EFF6FF,#EEF2FF); border:2px solid #2563EB; box-shadow:0 8px 28px -8px rgba(37,99,235,.18); }
  @keyframes lb-slide { to { opacity:1; transform:translateX(0); } }

  .lb-rank-num { font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; min-width:34px; text-align:center; color:#64748B; }
  .lb-mini-av {
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Syne',sans-serif; font-weight:700; font-size:.9rem; color:white;
    background:linear-gradient(135deg,#2563EB,#6366F1);
  }

  .lb-pill { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:.75rem; font-weight:500; }
  .lb-pill-score  { background:#DBEAFE; color:#1E40AF; }
  .lb-pill-acc    { background:#D1FAE5; color:#065F46; }
  .lb-pill-time   { background:#F3F4F6; color:#374151; }
  .lb-pill-coin   { background:#FEF3C7; color:#92400E; }
  .lb-pill-streak { background:#FFF7ED; color:#C2410C; }

  .lb-you-badge {
    background:#2563EB; color:white; font-size:.62rem; font-weight:700;
    padding:2px 6px; border-radius:999px; text-transform:uppercase; letter-spacing:.05em;
  }

  /* YOUR RANK CARD */
  .lb-your-card {
    background: linear-gradient(135deg, #2563EB, #4F46E5);
    border-radius: 20px; padding:22px 28px; color:white; position:relative; overflow:hidden;
  }
  .lb-your-card::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse 60% 80% at 110% 50%,rgba(255,255,255,.12),transparent);
    pointer-events:none;
  }
  .lb-pct-ring {
    width:88px; height:88px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(rgba(255,255,255,.9) var(--pct),rgba(255,255,255,.2) 0);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .lb-pct-ring::after {
    content:''; position:absolute;
    width:70px; height:70px; border-radius:50%; background:#2563EB;
  }
  .lb-pct-text { position:relative;z-index:2; font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; line-height:1; text-align:center; }

  /* SKELETON */
  .lb-skeleton {
    background:linear-gradient(90deg,#E2E8F0 25%,#F1F5F9 50%,#E2E8F0 75%);
    background-size:200% 100%; animation:lb-shimmer 1.4s infinite; border-radius:10px;
  }
  @keyframes lb-shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* SEARCH */
  .lb-search {
    background:#fff; border:1.5px solid #E2E8F0; border-radius:12px;
    padding:9px 14px 9px 40px; font-size:.92rem; width:100%; outline:none;
    transition:border .2s,box-shadow .2s;
  }
  .lb-search:focus { border-color:#2563EB; box-shadow:0 0 0 3px rgba(37,99,235,.1); }

  /* SHARE BTN */
  .lb-share-btn {
    background:linear-gradient(135deg,#F5A623,#F97316); color:white; border:none;
    border-radius:10px; padding:9px 18px; font-family:'Syne',sans-serif; font-weight:700;
    font-size:.88rem; cursor:pointer; transition:transform .2s,box-shadow .2s; white-space:nowrap;
  }
  .lb-share-btn:hover { transform:scale(1.05); box-shadow:0 8px 24px -6px rgba(245,166,35,.45); }

  /* TAB BTNS */
  .lb-tab {
    padding:7px 18px; border-radius:10px; font-weight:600; font-size:.88rem; cursor:pointer;
    border:1.5px solid #E2E8F0; background:white; color:#64748B; transition:all .2s;
  }
  .lb-tab.active { background:#2563EB; border-color:#2563EB; color:white; box-shadow:0 4px 12px -4px rgba(37,99,235,.4); }

  /* TOAST */
  #lb-toast {
    position:fixed; bottom:24px; right:24px; background:#0F172A; color:white;
    padding:11px 18px; border-radius:12px; font-size:.88rem; z-index:999;
    opacity:0; pointer-events:none; transform:translateY(8px); transition:all .3s;
  }
  #lb-toast.show { opacity:1; transform:translateY(0); pointer-events:auto; }

  /* stagger */
  .lb-row:nth-child(1){animation-delay:.04s}.lb-row:nth-child(2){animation-delay:.08s}
  .lb-row:nth-child(3){animation-delay:.12s}.lb-row:nth-child(4){animation-delay:.16s}
  .lb-row:nth-child(5){animation-delay:.20s}.lb-row:nth-child(6){animation-delay:.24s}
  .lb-row:nth-child(7){animation-delay:.28s}.lb-row:nth-child(8){animation-delay:.32s}
  .lb-row:nth-child(9){animation-delay:.36s}.lb-row:nth-child(10){animation-delay:.40s}
</style>
